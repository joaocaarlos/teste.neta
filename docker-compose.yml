services:
  postgres:
    image: postgres:16-alpine
    container_name: produflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: produflow
      POSTGRES_USER: produflow
      POSTGRES_PASSWORD: produflow
    ports:
      - '5432:5432'
    volumes:
      - produflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U produflow -d produflow']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  produflow_pgdata:
