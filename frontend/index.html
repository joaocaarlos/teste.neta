<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="color-scheme" content="dark light" />

    <!-- Favicon (múltiplos formatos) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO essencial -->
    <title>CapaCity — Marketplace B2B de Manufatura Industrial</title>
    <meta name="description" content="Conecte sua fábrica a empresas que precisam de capacidade produtiva. Demandas, propostas, contratos digitais e pagamentos protegidos em uma única plataforma." />
    <meta name="keywords" content="manufatura, terceirização, marketplace b2b, capacidade industrial, usinagem, injeção plástica, metalurgia, fornecedores industriais" />
    <meta name="author" content="CapaCity" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://capacity.com.br/" />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CapaCity" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="CapaCity — Marketplace B2B de Manufatura Industrial" />
    <meta property="og:description" content="Conecte sua fábrica a empresas que precisam de capacidade produtiva. Plataforma com contratos digitais e pagamentos protegidos." />
    <meta property="og:url" content="https://capacity.com.br/" />
    <meta property="og:image" content="https://capacity.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CapaCity — Marketplace industrial brasileiro" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@capacityindustrial" />
    <meta name="twitter:title" content="CapaCity — Marketplace B2B de Manufatura" />
    <meta name="twitter:description" content="Conecte sua fábrica a quem precisa terceirizar produção." />
    <meta name="twitter:image" content="https://capacity.com.br/og-image.png" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CapaCity",
      "url": "https://capacity.com.br",
      "logo": "https://capacity.com.br/logo.png",
      "description": "Marketplace B2B brasileiro que conecta fábricas com capacidade ociosa a empresas que terceirizam produção industrial.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "BR"
      },
      "sameAs": [
        "https://www.linkedin.com/company/capacity",
        "https://twitter.com/capacityindustrial"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://capacity.com.br",
      "name": "CapaCity",
      "inLanguage": "pt-BR",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://capacity.com.br/buscar?q={search_term}",
        "query-input": "required name=search_term"
      }
    }
    </script>

    <!-- Preconnect a fontes externas (perf) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://us.posthog.com" />
    <link rel="dns-prefetch" href="https://plausible.io" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Pular para o conteúdo</a>
    <div id="root"></div>
    <noscript>
      <div style="padding:32px;text-align:center;font-family:sans-serif;background:#070708;color:#F2EDE4;min-height:100vh">
        <h1>JavaScript é necessário</h1>
        <p>A CapaCity precisa de JavaScript ativado. Por favor, habilite no seu navegador.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
